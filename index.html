<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,sans-serif;
    color:#101b30;
    background:#fff;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(1180px,calc(100% - 40px));
    margin:auto;
}

/* =========================
   MENU
========================= */

header{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    z-index:100;
    background:rgba(5,16,32,.88);
    backdrop-filter:blur(15px);
}

.nav{
    height:82px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
}

.logo-icon{
    font-size:43px;
    transform:skew(-12deg);
    color:#fff;
}

.logo strong{
    display:block;
    font-size:22px;
    letter-spacing:-.5px;
}

.logo small{
    display:block;
    font-size:8px;
    letter-spacing:2px;
    opacity:.7;
}

nav{
    display:flex;
    align-items:center;
    gap:28px;
    color:white;
    font-size:13px;
    font-weight:600;
}

nav a{
    transition:.2s;
}
